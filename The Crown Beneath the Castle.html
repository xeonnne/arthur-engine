<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Crown Beneath the Castle</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0b0c10; color: #d9d2c2; font: 12px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
         display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; gap: 8px; }
  #view { height: min(calc(100vh - 70px), 177.78vw - 36px); aspect-ratio: 9 / 16; position: relative; border-radius: 10px; overflow: hidden; background: #000; cursor: pointer; }
  #view canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
  .row { display: flex; gap: 8px; align-items: center; width: min(100%, 420px); }
  button { font: inherit; color: #1b1620; background: #f2c230; border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: #f2c230; }
  #tc { font-variant-numeric: tabular-nums; opacity: .7; }
  #msg { display: none; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div id="view"></div>
<div id="msg">This needs WebGL, which isn't available in this browser.</div>
<div class="row"><button id="bPlay">Pause</button><button id="bRe">Restart</button><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline"><span id="tc">00.0</span></div>
<div class="row"><button id="bSound">Sound: off</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const view = document.getElementById('view');
const fail = () => { view.style.display = 'none'; document.getElementById('msg').style.display = 'block'; };
if (!window.THREE) return fail();
const T = THREE, DT = 1 / 120, TAU = Math.PI * 2;
const V = (x = 0, y = 0, z = 0) => new T.Vector3(x, y, z);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const wrap = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const lerpAngle = (a, b, k) => a + wrap(b - a) * k;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = (t, seed) => { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f); return lerp(hash(i + seed * 57.3), hash(i + 1 + seed * 57.3), u) * 2 - 1; };

/* ================= renderer, lights, stage ================= */
let renderer; try { renderer = new T.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { return fail(); }
renderer.setClearColor(0x000000, 1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
view.insertBefore(renderer.domElement, view.firstChild);
const scene = new T.Scene(), camera = new T.PerspectiveCamera(24, 9 / 16, .1, 100);
let mainRT = null; const uT = { value: 0 };
function resize() { const w = view.clientWidth, h = view.clientHeight; if (!w || !h) return; const pr = Math.min(window.devicePixelRatio || 1, 2); renderer.setPixelRatio(pr); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const W = Math.round(w * pr), H = Math.round(h * pr); if (!mainRT) { mainRT = renderer.capabilities.isWebGL2 ? new T.WebGLMultisampleRenderTarget(W, H) : new T.WebGLRenderTarget(W, H); if (mainRT.isWebGLMultisampleRenderTarget) mainRT.samples = 4; } else mainRT.setSize(W, H); }
window.addEventListener('resize', resize); resize();

const hemi = new T.HemisphereLight(0xffffff, 0xb8aebf, .7); scene.add(hemi);
const key = new T.DirectionalLight(0xfff1dc, .44); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -7.5, right: 7.5, top: 8, bottom: -5, near: 1, far: 30 }); key.shadow.bias = -.0008; key.shadow.normalBias = .035; key.shadow.radius = 3;
scene.add(key, key.target);
const KEY_OFF = V(-3.2, 7.5, 5.2);

const INK = 0x2b2030, SKIN = 0xf6d7b0, HAIR = 0x17111f, TUNIC = 0xf1e6cc, PANTS = 0x2c2640, SHOE = 0x6b5a6e, SOLE = 0xf1e6cc, ACC = 0xb5d95a, BELT = 0x5c3b33, EYE = 0xf8f1dc;

const ramp = new T.DataTexture(new Uint8Array([160, 160, 160, 200, 200, 200, 240, 240, 240, 255, 255, 255]), 4, 1, T.RGBFormat);
ramp.minFilter = ramp.magFilter = T.LinearFilter; ramp.needsUpdate = true;
const bodyMat = new T.MeshToonMaterial({ vertexColors: true, gradientMap: ramp });
bodyMat.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('#include <tonemapping_fragment>',
  'float rimF = pow(1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0), 2.8);\n gl_FragColor.rgb += vec3(1.0, 0.95, 0.86) * rimF * 0.2 * smoothstep(-0.3, 0.7, normal.y + normal.x * 0.5);\n #include <tonemapping_fragment>'); };
const inkMat = new T.ShaderMaterial({ side: T.BackSide, uniforms: { w: { value: .018 } },
  vertexShader: 'uniform float w; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); mv.xyz += normalize(normalMatrix * normal) * w; gl_Position = projectionMatrix * mv; }',
  fragmentShader: 'void main(){ gl_FragColor = vec4(0.0200, 0.0103, 0.0253, 1.0); }' });

/* merged, vertex-coloured parts: one mesh + one outline per bone */
const _c = new T.Color(), _n3 = new T.Matrix3(), _v = V();
class Part {
  constructor() { this.it = []; }
  add(g, color, p = [0, 0, 0], o = {}) { const q = new T.Quaternion(); if (o.q) q.copy(o.q); else if (o.r) q.setFromEuler(new T.Euler(o.r[0], o.r[1], o.r[2])); const s = o.s || [1, 1, 1];
    this.it.push({ g, color, m: new T.Matrix4().compose(V(p[0], p[1], p[2]), q, V(s[0], s[1], s[2])) }); return this; }
  geo() { let nv = 0, ni = 0; for (const i of this.it) { nv += i.g.attributes.position.count; ni += i.g.index.count; }
    const P = new Float32Array(nv * 3), N = new Float32Array(nv * 3), C = new Float32Array(nv * 3), I = new Uint32Array(ni); let vo = 0, io = 0;
    for (const { g, m, color } of this.it) { const p = g.attributes.position, n = g.attributes.normal; _n3.getNormalMatrix(m); _c.set(color).convertSRGBToLinear();
      for (let k = 0; k < p.count; k++) { const o = (vo + k) * 3; _v.fromBufferAttribute(p, k).applyMatrix4(m); P[o] = _v.x; P[o + 1] = _v.y; P[o + 2] = _v.z;
        _v.fromBufferAttribute(n, k).applyMatrix3(_n3).normalize(); N[o] = _v.x; N[o + 1] = _v.y; N[o + 2] = _v.z; C[o] = _c.r; C[o + 1] = _c.g; C[o + 2] = _c.b; }
      const ix = g.index.array; for (let k = 0; k < ix.length; k++) I[io + k] = ix[k] + vo; vo += p.count; io += ix.length; }
    const out = new T.BufferGeometry(); out.setAttribute('position', new T.BufferAttribute(P, 3)); out.setAttribute('normal', new T.BufferAttribute(N, 3)); out.setAttribute('color', new T.BufferAttribute(C, 3)); out.setIndex(new T.BufferAttribute(I, 1)); return out; }
  mesh(parent, mat) { const g = this._g || (this._g = this.geo()), m = new T.Mesh(g, mat || bodyMat); m.castShadow = m.receiveShadow = true; m.add(new T.Mesh(g, inkMat)); parent.add(m); return m; }
}
const sph = (r, s = 36) => new T.SphereGeometry(r, s, Math.round(s * .7));
function capsule(P, len, r0, r1, col) { P.add(new T.CylinderGeometry(r0, r1, len, 24, 1, true), col, [0, -len / 2, 0]); P.add(sph(r0, 24), col); P.add(sph(r1, 24), col, [0, -len, 0]); }
const G = (p, x = 0, y = 0, z = 0) => { const g = new T.Group(); g.position.set(x, y, z); p.add(g); return g; };

/* ================= skeleton ================= */
const HIP = .84, L1 = .35, L2 = .35, ANK = .16, UA = .29, FA = .29;
const footLift = p => { const c = Math.cos(p), s = Math.sin(p); return Math.max(0, .118 * c + .07 * s + Math.sqrt(.002025 * c * c + .059 * s * s) - ANK); };
const root = G(scene), hips = G(root, 0, HIP, 0), spine = G(hips), chest = G(spine, 0, .42, 0), neck = G(chest, 0, .3, 0), head = G(neck, 0, .04, 0);

// torso: one smooth mesh, soft-skinned between spine and chest
let torsoMesh, torsoBase, torsoBaseN, torsoW;
{ const P = new Part();
  const prof = [[0, .7], [.1, .7], [.19, .67], [.25, .6], [.275, .48], [.27, .28], [.3, .08], [.345, -.1], [.33, -.14], [.2, -.15], [0, -.15]].map(p => new T.Vector2(p[0], p[1]));
  P.add(new T.LatheGeometry(new T.SplineCurve(prof).getPoints(40).reverse(), 48), TUNIC, [0, 0, 0], { s: [1, 1, .78] });
  P.add(new T.TorusGeometry(.272, .03, 12, 48), BELT, [0, .2, 0], { r: [Math.PI / 2, 0, 0], s: [1, .78, 1] });
  P.add(sph(.04, 16), 0xe8c56a, [0, .2, .215]);
  P.add(new T.TorusGeometry(.155, .07, 16, 40), ACC, [0, .7, .01], { r: [Math.PI / 2 - .12, 0, 0], s: [1.15, 1, 1] });
  torsoMesh = P.mesh(spine); const g = torsoMesh.geometry; torsoBase = g.attributes.position.array.slice(); torsoBaseN = g.attributes.normal.array.slice();
  torsoW = new Float32Array(torsoBase.length / 3); for (let i = 0; i < torsoW.length; i++) torsoW[i] = smooth(.1, .5, torsoBase[i * 3 + 1]); }
{ const P = new Part(); P.add(new T.CylinderGeometry(.07, .08, .24, 20), SKIN, [0, 0, 0]); P.mesh(neck); }
const _sq = new T.Quaternion(), _sv = V(), _sn = V();
let lastSkin = '';
function skinTorso(force) { const q = chest.quaternion, k = q.x.toFixed(6) + q.y.toFixed(6) + q.z.toFixed(6) + q.w.toFixed(6); if (!force && k === lastSkin) return; lastSkin = k;
  const p = torsoMesh.geometry.attributes.position, n = torsoMesh.geometry.attributes.normal, P = p.array, N = n.array;
  for (let i = 0; i < torsoW.length; i++) { const w = torsoW[i], o = i * 3; if (w === 0) continue;
    _sv.set(torsoBase[o], torsoBase[o + 1] - .42, torsoBase[o + 2]).applyQuaternion(q); _sn.set(torsoBaseN[o], torsoBaseN[o + 1], torsoBaseN[o + 2]).applyQuaternion(q);
    P[o] = lerp(torsoBase[o], _sv.x, w); P[o + 1] = lerp(torsoBase[o + 1], _sv.y + .42, w); P[o + 2] = lerp(torsoBase[o + 2], _sv.z, w);
    N[o] = lerp(torsoBaseN[o], _sn.x, w); N[o + 1] = lerp(torsoBaseN[o + 1], _sn.y, w); N[o + 2] = lerp(torsoBaseN[o + 2], _sn.z, w); }
  p.needsUpdate = n.needsUpdate = true; }

// limbs: index 0 = his right (x<0), 1 = his left (x>0)
const arms = [-1, 1].map(sx => { const clav = G(chest, sx * .1, .16, 0), up = G(clav, sx * .17, 0, 0), fore = G(up, 0, -UA, 0), hand = G(fore, 0, -FA, 0);
  let P = new Part(); capsule(P, UA, .054, .051, SKIN); P.add(new T.CylinderGeometry(.086, .1, .22, 24, 1, true), TUNIC, [0, -.13, 0]); P.add(sph(.089, 24), TUNIC, [0, -.01, 0]); P.mesh(up);
  P = new Part(); capsule(P, FA, .051, .047, SKIN); P.mesh(fore);
  P = new Part(); P.add(sph(.082, 24), SKIN, [0, -.03, 0], { s: [1, 1.12, 1] }); P.add(sph(.034, 14), SKIN, [-sx * .02, -.03, .07]); P.mesh(hand);
  return { sx, clav, up, fore, hand, ik: 0, ikT: 0, tgt: V() }; });
const legs = [-1, 1].map(sx => { const thigh = G(hips, sx * .13, 0, 0), shin = G(thigh, 0, -L1, 0), foot = G(shin, 0, -L2, 0);
  let P = new Part(); capsule(P, L1, .075, .071, PANTS); P.mesh(thigh);
  P = new Part(); capsule(P, L2, .071, .065, PANTS); P.mesh(shin);
  P = new Part(); P.add(sph(.15, 28), SHOE, [0, -.045, .07], { s: [1, .78, 1.55] }); P.add(sph(.15, 28), SOLE, [0, -.118, .07], { s: [1.06, .3, 1.62] }); P.add(sph(.085, 20), PANTS, [0, .03, -.01], { s: [1.15, .6, 1.15] }); P.mesh(foot);
  return { sx, thigh, shin, foot, knee: V() }; });

// head
const HY = .44, HR = [.66, .5, .57], HC = V(0, .14, -.13), HS = [.69, .485, .585];
const onHead = (x, y) => HR[2] * Math.sqrt(Math.max(0, 1 - (x / HR[0]) ** 2 - (y / HR[1]) ** 2));
{ const P = new Part(); P.add(sph(1, 56), SKIN, [0, HY, 0], { s: HR });
  for (const sx of [-1, 1]) { P.add(sph(.12, 20), SKIN, [sx * .655, HY - .06, -.02], { s: [.62, 1, .9] }); P.add(sph(.06, 12), 0xf0a4a0, [sx * .683, HY - .06, 0], { s: [.35, .9, .7] }); }
  P.add(sph(1, 48), HAIR, [HC.x, HY + HC.y, HC.z], { s: HS }); P.mesh(head).receiveShadow = false; }
function spikeGeo(len, rad, flat = 1) { const pts = []; for (let i = 0; i <= 12; i++) { const u = i / 12; pts.push(new T.Vector2(Math.max(.0001, rad * Math.pow(1 - u, .8) * (1 - .12 * Math.sin(u * 3.14))), u * len)); }
  const g = new T.LatheGeometry(pts, 20); if (flat !== 1) g.scale(1, 1, flat); return g; }
const UP = V(0, 1, 0);
const clumps = {};
{ const piv = V(HC.x, HY + HC.y, HC.z), parts = { top: new Part(), back: new Part(), left: new Part(), right: new Part() };
  const dirOf = (az, el) => { const a = az * Math.PI / 180, e = el * Math.PI / 180; return V(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e)); };
  const SP = [[95, 8, .5, .2], [128, -8, .56, .21], [160, 6, .5, .2], [195, -6, .58, .22], [228, 8, .52, .2], [262, -4, .5, .2], [80, 34, .46, .2], [120, 38, .52, .21], [165, 44, .5, .22], [210, 40, .54, .21], [250, 36, .48, .2], [285, 30, .42, .19],
    [140, 68, .44, .2], [215, 70, .46, .2], [20, 74, .42, .17], [150, -30, .46, .2], [205, -32, .48, .2], [100, -22, .4, .18], [262, -24, .42, .18]];
  for (const [az, el, len, rad] of SP) { const d = dirOf(az, el), lean = d.clone().add(V(0, .22, -.1)).normalize(), k = el >= 60 ? 'top' : az < 135 ? 'left' : az > 225 ? 'right' : 'back';
    parts[k].add(spikeGeo(len, rad), HAIR, [d.x * HS[0] * .82, d.y * HS[1] * .82, d.z * HS[2] * .82], { q: new T.Quaternion().setFromUnitVectors(UP, lean) }); }
  for (const k in parts) { const g = G(head, piv.x, piv.y, piv.z); parts[k].mesh(g); clumps[k] = { g, rx: 0, rz: 0, vx: 0, vz: 0 }; }
  // fringe: flattened spikes lying on the forehead (flat side toward the face)
  const fp = V(0, HY + .36, .3), F = new Part(), m = new T.Matrix4();
  // three front spikes: built exactly like the rest of the hair, standing up and out from the front of the hair cap
  for (const [az, el, len, rad] of [[-38, 42, .44, .19], [0, 44, .48, .2], [38, 42, .44, .19]]) { const d = dirOf(az, el), lean = d.clone().add(V(0, .22, -.1)).normalize();
    F.add(spikeGeo(len, rad), HAIR, [HC.x + d.x * HS[0] * .82 - fp.x, HY + HC.y + d.y * HS[1] * .82 - fp.y, HC.z + d.z * HS[2] * .82 - fp.z], { q: new T.Quaternion().setFromUnitVectors(UP, lean) }); }
  const g = G(head, fp.x, fp.y, fp.z); F.mesh(g); clumps.fringe = { g, rx: 0, rz: 0, vx: 0, vz: 0 }; }

// eyes: blank ovals; lids, lid tilt and arch are drawn in the shader so each eye is fully posable
const ER = [.185, .277];
const eyes = [-1, 1].map(sx => { const g = G(head), geo = sph(1, 40); geo.scale(ER[0], ER[1], .032);
  const mat = new T.ShaderMaterial({ uniforms: { lidU: { value: 1.3 }, lidL: { value: -1.3 }, tilt: { value: 0 }, arch: { value: 0 }, sil: { value: 0 }, sx: { value: sx } }, extensions: { derivatives: true },
    vertexShader: 'varying vec2 vP; void main(){ vP = position.xy / vec2(' + ER[0] + ',' + ER[1] + '); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `varying vec2 vP; uniform float lidU, lidL, tilt, arch, sil, sx;
      void main(){ vec2 p = vP; if (sil > 0.5) { if (p.y > 0.28 + 0.6 * p.x * sx || p.y < -0.72 || dot(p, p) > 0.84) discard; gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); return; } float a = arch * (1.0 - p.x * p.x); float up = lidU + tilt * p.x + a, lo = lidL + a; float lw = 0.075;
        vec3 ink = vec3(0.0200, 0.0103, 0.0253), eye = vec3(0.941, 0.883, 0.723);
        if (up - lo < lw * 1.3) { float mid = (up + lo) * 0.5; if (abs(p.y - mid) > lw * 0.62 || dot(p, p) > 1.0) discard; gl_FragColor = vec4(ink, 1.0); return; }
        if (p.y > up || p.y < lo) discard;
        vec2 q = p * vec2(1.105, 1.068); float r = dot(q, q); float aa = fwidth(r) * 1.2;
        float e = max(smoothstep(1.0 - aa, 1.0 + aa, r), max(smoothstep(up - lw - 0.02, up - lw + 0.02, p.y), 1.0 - smoothstep(lo + lw - 0.02, lo + lw + 0.02, p.y)));
        gl_FragColor = vec4(mix(eye, ink, e), 1.0); }` });
  const em = new T.Mesh(geo, mat); g.add(em); return { sx, g, u: mat.uniforms, mesh: em }; });

// mouth + brows: one dynamic mesh wrapped onto the face
const MN = 14, BN = 6, MOUTH_Y = -.27, BROW_Y = .322;
const faceGeo = new T.BufferGeometry(); let facePos, faceStrips = {};
{ const strips = [['fill', MN, 0x4a1f2c], ['teeth', MN, 0xfbf6e6], ['tongue', MN, 0xe07a7a], ['lu', MN, INK], ['ll', MN, INK], ['b0', BN, INK], ['b1', BN, INK]];
  let nv = 0; for (const s of strips) nv += (s[1] + 1) * 2; facePos = new Float32Array(nv * 3); const col = new Float32Array(nv * 3), idx = []; let o = 0;
  for (const [name, n, c] of strips) { faceStrips[name] = o; _c.set(c).convertSRGBToLinear(); for (let i = 0; i < (n + 1) * 2; i++) { col[(o + i) * 3] = _c.r; col[(o + i) * 3 + 1] = _c.g; col[(o + i) * 3 + 2] = _c.b; }
    for (let i = 0; i < n; i++) { const a = o + i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } o += (n + 1) * 2; }
  faceGeo.setAttribute('position', new T.BufferAttribute(facePos, 3)); faceGeo.setAttribute('color', new T.BufferAttribute(col, 3)); faceGeo.setIndex(idx);
  const m = new T.Mesh(faceGeo, new T.MeshBasicMaterial({ vertexColors: true, side: T.DoubleSide })); m.frustumCulled = false; m.userData.noSil = true; head.add(m); }
const blushMat = new T.MeshBasicMaterial({ color: 0xee8f8a, transparent: true, opacity: .5, depthWrite: false });
for (const sx of [-1, 1]) { const bx = sx * .44, by = -.2, b = new T.Mesh(new T.CircleGeometry(.085, 28), blushMat); b.position.set(bx, HY + by, onHead(bx, by) + .012); b.rotation.set(.25, sx * .78, 0); b.scale.y = .62; b.userData.noSil = true; head.add(b); }

// scarf tail: three-link chain
const tail = []; { let par = G(chest, -.14, .24, -.15); for (let i = 0; i < 3; i++) { const P = new Part(), r = .056 - i * .006;
    P.add(new T.CylinderGeometry(r, r - .006, .13, 16, 1, true), ACC, [0, -.065, 0], { s: [1.3, 1, .6] }); P.add(sph(r, 16), ACC, [0, 0, 0], { s: [1.3, 1, .6] }); P.add(sph(r - .006, 16), ACC, [0, -.13, 0], { s: [1.3, 1, .6] }); P.mesh(par);
    tail.push({ g: par, rx: 0, rz: 0, vx: 0, vz: 0 }); if (i < 2) par = G(par, 0, -.13, 0); } }

// a prop to interact with
const prop = new T.Group(); prop.visible = false; scene.add(prop);
{ const P = new Part(); P.add(sph(.115, 28), 0xe0603c, [0, 0, 0], { s: [1, .92, 1] }); P.add(new T.CylinderGeometry(.012, .016, .07, 8), 0x5c3b33, [0, .12, 0]); P.add(sph(.04, 12), 0x6aa85a, [.045, .14, 0], { s: [1.3, .35, .7] }); P.mesh(prop); }
const PROP_HOME = V(1.25, .11, .95), GRIP = V(0, -.15, .05);

/* ================= story world: crown, sets, knights, living shadow ================= */
const WALL_Z = -2.2, SH_X = -.75, PED_X = -1.25, CROWN_HOME = V(PED_X, 1.125, 0), CROWN_ON = V(0, .585, -.13), GRIP_R = .335, GRIP_Y = .06;
// gold: stylised reflection bands, fresnel sheen and a travelling glint
const goldMat = new T.ShaderMaterial({ uniforms: { uTime: uT, glow: { value: 1 } }, vertexColors: true, side: T.DoubleSide,
  vertexShader: 'varying vec3 vN; varying vec3 vC; varying vec3 vW; varying vec3 vO; void main(){ vC = color; vO = position; vN = normalize(normalMatrix * normal); vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',

    env(g, t, at || .004, dur, peak); o.connect(g); g.connect(master); g.connect(echo); o.start(t); o.stop(t + (at || 0) + dur + .1); }
  const P = {
    step(t) { const v = .8 + Math.random() * .4; noise(t, .07, 'lowpass', 900 * v, 300, .2); tone(t, 95 * v, 50, .09, .16); noise(t + .02, .03, 'highpass', 3000, 0, .03); },
    scuff(t) { noise(t, .09, 'bandpass', 700, 350, .09, 1); },
    touch(t) { tone(t, 1250, 900, .08, .06, 'triangle'); noise(t, .04, 'highpass', 4000, 0, .03); },
    shimmer(t) { for (const [f, d] of [[880, 0], [1320, .12], [1760, .25], [2640, .4], [3520, .55]]) tone(t + d, f, f * 1.01, 1.3, .035, 'sine', .25); noise(t, 1.4, 'highpass', 6000, 9000, .012, .7, .4); },
    crown(t) { for (const [f, p] of [[523.25, .12], [784, .09], [1046.5, .08], [1568, .05], [2093, .03]]) tone(t, f, f, 2.2, p, 'sine', .006); noise(t, .5, 'highpass', 7000, 0, .04); tone(t, 130.8, 65, .7, .16); },
    bow(t) { for (let i = 0; i < 5; i++) { const u = t + .22 + i * .2 + Math.random() * .04, v = .85 + Math.random() * .3; noise(u, .06, 'bandpass', 3200 * v, 0, .07, 4); tone(u, 310 * v, 290 * v, .16, .04, 'square'); noise(u + .05, .22, 'lowpass', 500, 250, .06); } },
    dread(t) { tone(t, 46, 41, 2.6, .2, 'sine', .9); noise(t, 2.2, 'lowpass', 180, 420, .05, .7, 1.2); },
    draw(t) { noise(t + .95, .38, 'bandpass', 2200, 8500, .13, 6, .02); for (const f of [3100, 4650, 6200]) tone(t + 1.25, f, f * .995, 1.1, .035, 'sine', .01);
      tone(t + 1.5, 62, 31, 1.6, .3, 'sine', .02); for (const f of [110, 116.5, 233]) tone(t + 1.5, f, f, 2.2, .06, 'sawtooth', .05); }
  };
  function ambience(name, t) { if (name === ambSet) return; ambSet = name; if (amb) { const old = amb; old.g.gain.setTargetAtTime(0, t, .25); setTimeout(() => old.nodes.forEach(n => { try { n.stop(); } catch (e) {} }), 1500); }
    const g = c.createGain(), vault = name === 'vault', nodes = []; g.gain.value = 0; g.gain.setTargetAtTime(1, t, .6); g.connect(master);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), ng = c.createGain(); s.buffer = nb; s.loop = true; f.type = 'lowpass'; f.frequency.value = vault ? 210 : 380; ng.gain.value = vault ? .07 : .05; s.connect(f); f.connect(ng); ng.connect(g); s.start(t); nodes.push(s);
    for (const [fr, p] of vault ? [[55, .03], [82.4, .018]] : [[73.4, .012]]) { const o = c.createOscillator(), og = c.createGain(); o.frequency.value = fr; og.gain.value = p; o.connect(og); og.connect(g); o.start(t); nodes.push(o); }
    echo.gain.setTargetAtTime(vault ? .5 : .16, t, .2); amb = { g, nodes }; nextBit = t + 1; }
  function update(playing) { const ctx = sound.ctx(); if (!ctx) { if (master) master.gain.setTargetAtTime(0, c.currentTime, .03); idx = sfxQ.length; return; } if (!c) init(ctx);
    const t = c.currentTime; master.gain.setTargetAtTime(playing ? 1.5 : 0, t, .04); if (idx > sfxQ.length) idx = 0; if (!playing) { idx = sfxQ.length; return; }
    ambience(S.set, t); while (idx < sfxQ.length) { const p = P[sfxQ[idx++][1]]; if (p) p(t); }
    if (t > nextBit) { if (S.set === 'vault') { tone(t, 1900 + Math.random() * 500, 950, .07, .03); nextBit = t + 2 + Math.random() * 3.5; }                           // water drip
      else { noise(t, .02 + Math.random() * .03, 'bandpass', 1500 + Math.random() * 2500, 0, .025, 2); nextBit = t + .15 + Math.random() * .7; } } }   // torch crackle
  return { update, skip() { idx = sfxQ.length; } };
})();

/* ================= playback ================= */
const bPlay = document.getElementById('bPlay'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
let playing = true, manual = false, last = 0, acc = 0;
const setPlaying = p => { playing = p; bPlay.textContent = p ? 'Pause' : 'Play'; };
function seek(t) { if (t < S.t - 1e-6) reset(true); while (S.t + 1e-9 < t) step(); sfx.skip(); }
bPlay.onclick = () => setPlaying(!playing); view.onclick = () => setPlaying(!playing);
document.getElementById('bRe').onclick = () => { reset(true); setPlaying(true); };
scrub.oninput = () => { seek(scrub.value / 1000 * REEL_END); };
reset(true); step(); draw();
function frame(now) { requestAnimationFrame(frame); if (manual) return; const dt = Math.min(.1, (now - last) / 1000 || 0); last = now;
  if (playing) { acc += dt; let n = 0; while (acc >= DT && n < 24) { step(); acc -= DT; n++; } if (n === 24) acc = 0; if (S.t > REEL_END) reset(true); scrub.value = Math.round(S.t / REEL_END * 1000); }
  sfx.update(playing); tc.textContent = S.t.toFixed(1).padStart(4, '0'); draw(); }
requestAnimationFrame(frame);
// Frame-by-frame capture: STORY.renderAt(seconds) always draws the same picture for the same time.
window.STORY = { duration: REEL_END, renderAt(t) { manual = true; seek(t); draw(); return S.t; }, live() { manual = false; },
  state() { let h = 0; for (let i = 0; i < NC; i++) h += val[i] * (i + 1); return { t: S.t, hash: h + S.pos.x * 7 + S.pos.z * 11 + S.heading + crown.position.y, act: S.act, phase: S.phase, emo: S.emo, set: S.set, speed: S.speed, crowned: S.crowned, det: S.shadow.det, calls: renderer.info.render.calls, px: S.pos.x, pz: S.pos.z, hd: S.heading, cam: S.cam.pos.toArray().map(v => +v.toFixed(2)), tgt: S.cam.tgt.toArray().map(v => +v.toFixed(2)), fov: camera.fov }; } };
})();
</script>
